version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: sales_inventory_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: sales_inventory
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_mysql.sql:/docker-entrypoint-initdb.d/init_mysql.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MailHog SMTP Testing Inbox
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sales_inventory_mailhog
    restart: always
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI inbox
    logging:
      driver: 'none'

  # FastAPI Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales_inventory_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      DATABASE_URL: mysql+pymysql://app_user:app_password@mysql:3306/sales_inventory
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      DEFAULT_APPROVAL_THRESHOLD: 10000.00
      JWT_SECRET: super-secret-sales-inventory-jwt-key-2026
    ports:
      - "8000:8000"

  # React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sales_inventory_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mysql_data:

